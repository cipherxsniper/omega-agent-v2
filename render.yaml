services:
  - type: web
    name: omega-chat-backend
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: mkdir -p ~/.omega/logs ~/.omega/locks && exec gunicorn agent.chat_server:app --bind 0.0.0.0:$PORT --timeout 120
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-6
      - key: PROOFCHAIN_KEYFILE
        sync: false
      - key: OMEGA_ALLOWED_ORIGIN
        sync: false
